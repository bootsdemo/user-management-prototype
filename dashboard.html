<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Management - Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: sans-serif; margin: 0; display: flex; }
        #sidebar { width: 250px; background: #f4f4f4; height: 100vh; padding: 20px; border-right: 1px solid #ddd; }
        #main-content { flex-grow: 1; padding: 40px; }
        .user-info { font-size: 0.9em; color: #666; margin-bottom: 30px; }
        .card { border: 1px solid #ddd; padding: 15px; border-radius: 8px; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; }
        .badge { background: #e0e0e0; padding: 4px 8px; border-radius: 4px; font-size: 0.8em; margin-left: 10px; }
        .btn-logout { color: red; cursor: pointer; text-decoration: underline; font-size: 0.8em; }
        .btn-add { background: #007bff; color: white; border: none; padding: 8px 12px; border-radius: 4px; cursor: pointer; font-size: 0.8em; }
        
        /* Modal Styles */
        #addUserModal { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); z-index:1000; }
        .modal-content { background:white; width:400px; margin:100px auto; padding:20px; border-radius:8px; box-shadow: 0 4px 15px rgba(0,0,0,0.2); }
        .modal-content input, .modal-content select { width: 100%; padding: 8px; margin: 8px 0 15px 0; border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box; }
    </style>
</head>
<body>

    <div id="addUserModal">
        <div class="modal-content">
            <h3>Add Staff to <span id="targetBusinessName" style="color:#007bff;"></span></h3>
            <form id="addUserForm">
                <input type="hidden" id="targetMid">
                <label>First Name</label>
                <input type="text" id="newFirstName" required>
                <label>Last Name</label>
                <input type="text" id="newLastName" required>
                <label>Email Address</label>
                <input type="email" id="newEmail" required>
                <label>Assign Role</label>
                <select id="roleDropdown" required></select>
                <div style="display:flex; justify-content: flex-end; gap: 10px;">
                    <button type="button" onclick="closeModal()">Cancel</button>
                    <button type="submit" style="background:#28a745; color:white;">Confirm Add</button>
                </div>
            </form>
        </div>
    </div>

    <div id="sidebar">
        <h3>Menu</h3>
        <p style="font-weight: bold;">My Businesses</p>
        <hr>
        <div class="user-info">
            Logged in as: <br><span id="display-name" style="color:black; font-weight:bold;">...</span><br>
            <span class="btn-logout" onclick="logout()">Logout / Switch User</span>
        </div>
    </div>

    <div id="main-content">
        <h1>My Businesses</h1>
        <div id="business-list">Loading...</div>
    </div>

    <script>
        const SUPABASE_URL = 'https://tsgpgauyimwlechpedpk.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRzZ3BnYXV5aW13bGVjaHBlZHBrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzUzODE1NjIsImV4cCI6MjA5MDk1NzU2Mn0.jFhmn2gxhDr9MuHg_TyCJPnnsyNbdDN56HAZn3Ydbyg'; // <--- REPLACE WITH YOUR KEY
        const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        window.onload = async function() {
            const storedEmail = localStorage.getItem('currentUserEmail');
            const userEmail = storedEmail ? storedEmail.toLowerCase().trim() : null;
            const userName = localStorage.getItem('currentUserName');

            if (!userEmail) {
                window.location.href = 'index.html';
                return;
            }

            document.getElementById('display-name').textContent = userName;

            // 1. Fetch permissions for the logged-in user
            const { data: permissions, error } = await sb
                .from('user_permissions')
                .select('mid_number, role_name, product_name')
                .eq('user_email', userEmail);

            const listDiv = document.getElementById('business-list');

            if (error) {
                listDiv.innerHTML = "Error: " + error.message;
            } else if (!permissions || permissions.length === 0) {
                // Logic for why Tina might be seeing nothing:
                listDiv.innerHTML = `No businesses assigned to <strong>${userEmail}</strong>. <br>Please verify this email exists in your user_permissions table.`;
            } else {
                listDiv.innerHTML = ""; 
                
                for (const p of permissions) {
                    // Fetch Business Name from mid_role_logic (Source of Truth)
                    const { data: bizData } = await sb
                        .from('mid_role_logic')
                        .select('business_name')
                        .eq('mid_number', p.mid_number)
                        .limit(1)
                        .maybeSingle();

                    const bName = bizData ? bizData.business_name : ("MID: " + p.mid_number);

                    // 2. CHECK ROLE PERMISSION: Only Principal or Business Manager see the button
                    const canAddUser = (p.role_name === 'Principal' || p.role_name === 'Business Manager');
                    const actionButton = canAddUser 
                        ? `<button class="btn-add" onclick="openAddUserModal('${p.mid_number}', '${bName}')">+ Add Staff</button>`
                        : `<span style="font-size:0.8em; color:gray;">View Only</span>`;

                    const card = document.createElement('div');
                    card.className = 'card';
                    card.innerHTML = `
                        <div>
                            <strong>${bName}</strong><br>
                            <small>MID: ${p.mid_number}</small><br>
                            <span class="badge">${p.role_name}</span>
                        </div>
                        ${actionButton}
                    `;
                    listDiv.appendChild(card);
                }
            }
        };

        // Modal and Add User logic remains the same
        async function openAddUserModal(mid, businessName) {
            document.getElementById('targetMid').value = mid;
            document.getElementById('targetBusinessName').innerText = businessName;
            
            const { data: roles } = await sb
                .from('mid_role_logic')
                .select('role_name')
                .eq('mid_number', mid)
                .neq('role_name', 'Principal'); 

            const dropdown = document.getElementById('roleDropdown');
            dropdown.innerHTML = roles && roles.length > 0 
                ? roles.map(r => `<option value="${r.role_name}">${r.role_name}</option>`).join('')
                : '<option value="">No roles available</option>';
            
            document.getElementById('addUserModal').style.display = 'block';
        }

        function closeModal() {
            document.getElementById('addUserModal').style.display = 'none';
            document.getElementById('addUserForm').reset();
        }

        document.getElementById('addUserForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const mid = document.getElementById('targetMid').value;
            const bizName = document.getElementById('targetBusinessName').innerText;
            const firstName = document.getElementById('newFirstName').value;
            const lastName = document.getElementById('newLastName').value;
            const role = document.getElementById('roleDropdown').value;
            const email = document.getElementById('newEmail').value.toLowerCase().trim();

            await sb.from('profiles').upsert({ email, first_name: firstName, last_name: lastName }, { onConflict: 'email' });
            const { error } = await sb.from('user_permissions').insert([{ user_email: email, mid_number: mid, role_name: role, product_name: 'SMB' }]);

            if (!error) { alert('User added!'); closeModal(); } else { alert(error.message); }
        });

        function logout() { localStorage.clear(); window.location.href = 'index.html'; }
    </script>
</body>
</html>
