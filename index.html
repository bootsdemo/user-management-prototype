<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Management Prototype - Login</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: sans-serif; max-width: 500px; margin: 50px auto; padding: 20px; line-height: 1.6; }
        .card { border: 1px solid #ddd; padding: 25px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        select, button { width: 100%; padding: 12px; margin-top: 15px; border-radius: 4px; border: 1px solid #ccc; font-size: 1rem; }
        button { background-color: #007bff; color: white; border: none; cursor: pointer; font-weight: bold; }
        button:disabled { background-color: #ccc; cursor: not-allowed; }
        #status { font-size: 0.85rem; margin-top: 20px; text-align: center; }
    </style>
</head>
<body>

    <div class="card">
        <h2>Identity Selector</h2>
        <p>Choose a user to begin testing the prototype visibility logic.</p>
        
        <select id="user-selector">
            <option value="">-- Select a User --</option>
        </select>

        <button id="login-btn" disabled>Enter Prototype</button>
        
        <div id="status">Connecting to database...</div>
    </div>

    <script>
        // --- 2. YOUR CREDENTIALS (REPLACE THESE) ---
        const SUPABASE_URL = 'https://tsgpgauyimwlechpedpk.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRzZ3BnYXV5aW13bGVjaHBlZHBrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzUzODE1NjIsImV4cCI6MjA5MDk1NzU2Mn0.jFhmn2gxhDr9MuHg_TyCJPnnsyNbdDN56HAZn3Ydbyg';

        window.onload = async function() {
            const userSelector = document.getElementById('user-selector');
            const loginBtn = document.getElementById('login-btn');
            const statusDiv = document.getElementById('status');

            // Initialize Supabase
            const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

            // 3. Fetch all Principals from the 'profiles' table
            try {
                const { data: users, error } = await sb
                    .from('profiles')
                    .select('email, first_name, last_name');

                if (error) {
                    statusDiv.innerHTML = "❌ Error: " + error.message;
                    statusDiv.style.color = "red";
                } else {
                    statusDiv.innerHTML = "✅ Database Connected. Ready to test.";
                    statusDiv.style.color = "green";
                    
                    // Fill the dropdown
                    users.forEach(user => {
                        const option = document.createElement('option');
                        option.value = user.email;
                        option.textContent = `${user.first_name} ${user.last_name}`;
                        userSelector.appendChild(option);
                    });
                }
            } catch (err) {
                statusDiv.innerHTML = "❌ Script Error: " + err.message;
            }

            // 4. Enable button only when a user is picked
            userSelector.onchange = function() {
                loginBtn.disabled = !userSelector.value;
            };

            // 5. Handle "Login"
            loginBtn.onclick = function() {
                const selectedEmail = userSelector.value;
                const selectedName = userSelector.options[userSelector.selectedIndex].text;
                
                // Store session info locally in the browser
                localStorage.setItem('currentUserEmail', selectedEmail);
                localStorage.setItem('currentUserName', selectedName);
                
                // Redirect to the dashboard
                window.location.href = 'dashboard.html';
            };
        };
    </script>
</body>
</html>
