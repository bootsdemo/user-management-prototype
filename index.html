<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Management Prototype - Connection Test</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <h1>Prototype Connection Status</h1>
    <div id="status">Connecting to Supabase...</div>
    <ul id="user-list"></ul>

    <script>
        // 2. WAIT FOR THE PAGE TO LOAD COMPLETELY
        window.onload = async function() {
            const statusDiv = document.getElementById('status');
            const userList = document.getElementById('user-list');

            // 3. YOUR CREDENTIALS (REPLACE THESE)
            const SUPABASE_URL = 'https://tsgpgauyimwlechpedpk.supabase.co';
            const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRzZ3BnYXV5aW13bGVjaHBlZHBrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzUzODE1NjIsImV4cCI6MjA5MDk1NzU2Mn0.jFhmn2gxhDr9MuHg_TyCJPnnsyNbdDN56HAZn3Ydbyg';

            // 4. CHECK IF SUPABASE IS DEFINED
            if (typeof supabase === 'undefined') {
                statusDiv.innerHTML = "❌ Error: Supabase library failed to load.";
                statusDiv.style.color = "red";
                return;
            }

            try {
                // 5. CREATE THE CLIENT
                const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

                // 6. FETCH THE DATA
                const { data, error } = await sb
                    .from('profiles')
                    .select('first_name, last_name');

                if (error) {
                    statusDiv.innerHTML = "❌ Connection Error: " + error.message;
                    statusDiv.style.color = "red";
                } else {
                    statusDiv.innerHTML = "✅ Successfully connected to Supabase!";
                    statusDiv.style.color = "green";
                    
                    data.forEach(user => {
                        const li = document.createElement('li');
                        li.textContent = user.first_name + " " + user.last_name;
                        userList.appendChild(li);
                    });
                }
            } catch (err) {
                statusDiv.innerHTML = "❌ Script Error: " + err.message;
            }
        };
    </script>
</body>
</html>
