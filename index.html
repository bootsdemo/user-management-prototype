    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function testConnection() {
            const statusDiv = document.getElementById('status');
            const userList = document.getElementById('user-list');

            // 2. Try to fetch the Principals we uploaded earlier
            const { data, error } = await supabase
                .from('profiles')
                .select('first_name, last_name');

            if (error) {
                statusDiv.innerHTML = "❌ Connection Error: " + error.message;
                statusDiv.style.color = "red";
            } else {
                statusDiv.innerHTML = "✅ Successfully connected to Supabase!";
                statusDiv.style.color = "green";
                
                // Display the names to prove data is flowing
                data.forEach(user => {
                    const li = document.createElement('li');
                    li.textContent = `${user.first_name} ${user.last_name}`;
                    userList.appendChild(li);
                });
            }
        }

        testConnection();
